# OpenSSF Scorecard. It must run in this repository, not as a reusable workflow, to publish its
# results.

name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "43 5 * * 1"

permissions: {}

jobs:
  analysis:
    name: Scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Scorecard publishes no major-version tag, so this is an exact version.
      - uses: ossf/scorecard-action@v2.5.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: scorecard.sarif
          category: scorecard
