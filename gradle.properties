# The release train: every module in kiln-components shares this version.
group=com.bulmerkiln
version=0.1.0-SNAPSHOT

org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true
# The daemon runs the analysis tasks for every module at once; the 512 MB default thrashes.
org.gradle.jvmargs=-Xmx1g --enable-native-access=ALL-UNNAMED
